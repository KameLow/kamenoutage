<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="参加予定・参加済みのイベントの一覧です。">
  <meta name="theme-color" content="#0e1d17">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="images/common/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="かめの宴">
  <meta property="og:title" content="Events | かめの宴">
  <meta property="og:description" content="参加予定・参加済みのイベントの一覧です。">
  <!-- 公開後：<meta property="og:image" content="https://（ドメイン）/images/common/ogp.png"> と og:url を追加するとSNSで見栄えがよくなります -->
  <title>Events | かめの宴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <script>document.write('<link rel="stylesheet" href="style.css?v='+Date.now()+'">')</script>
  <noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <noscript><p class="noscript-msg">このサイトの表示には JavaScript が必要です。ブラウザの設定で JavaScript を有効にしてください。</p></noscript>
    <section class="block page-top" aria-labelledby="h-events">
      <h1 class="page-title" id="h-events">Events</h1>
      <div class="gallery-desc" id="events-desc"></div>
    </section>

    <section class="block" aria-labelledby="h-next">
      <h2 id="h-next">次回参加予定のイベント</h2>
      <div id="next-event"></div>
    </section>

    <section class="block" aria-labelledby="h-eventlist">
      <h2 id="h-eventlist">イベント一覧</h2>
      <div class="info-tools">
        <label class="visually-hidden" for="q">キーワードで検索</label>
        <input id="q" type="search" placeholder="イベント名・会場・新刊などで検索" autocomplete="off">
        <label class="visually-hidden" for="year">開催年</label>
        <select id="year"><option value="">すべての年</option></select>
        <label class="visually-hidden" for="status">参加状況</label>
        <select id="status">
          <option value="">参加予定・終了すべて</option>
          <option value="upcoming">参加予定のみ</option>
          <option value="past">終了したイベントのみ</option>
        </select>
      </div>
      <p class="info-count" id="result" aria-live="polite"></p>
      <div id="event-list"></div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="page/boot.js?v=1" data-load="lastest/EVENTS.js lastest/SITE.js page/common.js page/parts.js page/events-page.js"></script>
</body>
</html>
