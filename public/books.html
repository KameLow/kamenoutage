<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="既刊（同人誌）の一覧です。サイズ・価格・通販リンクなどを掲載しています。">
  <meta name="theme-color" content="#0e1d17">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="images/common/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="かめの宴">
  <meta property="og:title" content="Books | かめの宴">
  <meta property="og:description" content="既刊（同人誌）の一覧です。サイズ・価格・通販リンクなどを掲載しています。">
  <meta property="og:image" content="https://kamelow.com/common/OGP.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="600">
  <meta property="og:image:alt" content="かめの宴 公式サイト">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="https://kamelow.com/common/OGP_square.png">
  <meta name="twitter:image:alt" content="かめの宴 公式サイト">
  <!-- ↑ https://example.com は、実際のサイトのアドレス（例：https://自分のドメイン）に書き換えてください（全ページ同じです）。
       SNSの画像は、絶対アドレス（https:// から始まる形）でないと表示されません。
       X：twitter:card が summary → 正方形の小さい画像（twitter:image = ogp-square.png）。
          大きい横長の画像にしたいときは、twitter:card を summary_large_image に変え、twitter:image の2行を消します（og:image = ogp.png が使われます）。
       X以外（LINE・Discordなど）：og:image の横長の画像（ogp.png）が使われます。
       画像を差し替えたあと、SNSに古い画像が残る場合は、画像のアドレスの後ろに ?v=2 のように付けると更新されます -->
  <title>Books | かめの宴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <script>document.write('<link rel="stylesheet" href="style.css?v='+Date.now()+'">')</script>
  <noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <noscript><p class="noscript-msg">このサイトの表示には JavaScript が必要です。ブラウザの設定で JavaScript を有効にしてください。</p></noscript>
    <section class="block page-top" aria-labelledby="h-books">
      <h1 class="page-title" id="h-books">Books</h1>
      <div class="gallery-desc" id="books-desc"></div>

      <div class="info-tools">
        <label class="visually-hidden" for="q">キーワードで検索</label>
        <input id="q" type="search" placeholder="タイトル・説明文などで検索" autocomplete="off">
      </div>
      <p class="info-count" id="result" aria-live="polite"></p>

      <nav class="pager" id="pager-top" aria-label="ページ切り替え（上）"></nav>
      <ul class="book-list" id="book-list"></ul>
      <nav class="pager" id="pager-bottom" aria-label="ページ切り替え（下）"></nav>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="page/boot.js?v=1" data-load="lastest/BOOKS.js lastest/SITE.js page/common.js page/pager.js page/parts.js page/books-page.js"></script>
</body>
</html>
